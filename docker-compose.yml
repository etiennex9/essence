name: essence

# Secrets come from .env (copy .env.example). Passwords go into connection strings: avoid ; = ' and ".
# "GSS Encryption Mode=Disable": the .NET runtime images have no Kerberos library, so Npgsql's GSS probe only logs an error.
x-dotnet-env: &dotnet-env
  DOTNET_ENVIRONMENT: Production
  TZ: UTC

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: essence
      POSTGRES_USER: ${POSTGRES_USER:-essence_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subfolder of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: on first start, the server that initializes the database answers on the socket only, and migrate would fail.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: src/Essence.Migrator/Dockerfile
    environment:
      <<: *dotnet-env
      ConnectionStrings__Admin: Host=postgres;Database=essence;Username=${POSTGRES_USER:-essence_admin};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Roles__WriterPassword: ${ESSENCE_WRITER_PASSWORD:?Set ESSENCE_WRITER_PASSWORD in .env}
      Roles__ReaderPassword: ${ESSENCE_READER_PASSWORD:?Set ESSENCE_READER_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    build:
      context: .
      dockerfile: src/Essence.Ingest/Dockerfile
    environment:
      <<: *dotnet-env
      ConnectionStrings__Essence: Host=postgres;Database=essence;Username=essence_writer;Password=${ESSENCE_WRITER_PASSWORD};GSS Encryption Mode=Disable
      Archive__Path: /data/archive
    volumes:
      - data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Essence.Api/Dockerfile
    environment:
      <<: *dotnet-env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Essence: Host=postgres;Database=essence;Username=essence_reader;Password=${ESSENCE_READER_PASSWORD};GSS Encryption Mode=Disable
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Routing for Best near you by road and Best on the way, in the "trip" profile: `docker compose --profile trip up`. It
  # builds its data on its first start (a 1.2 GB download, then a few minutes and 3.2 GB of RAM) into the routing
  # volume, refreshes it every REFRESH_DAYS days, and reports its progress at :9090/status; the api estimates meanwhile.
  # ROUTING_PBF_URL in .env points it at another copy of Geofabrik's extract.
  routing:
    profiles: [trip]
    build:
      context: .
      dockerfile: src/Essence.Routing/Dockerfile
    environment:
      REFRESH_DAYS: ${REFRESH_DAYS:-30}
      ROUTING_PBF_URL: ${ROUTING_PBF_URL:-}
    volumes:
      - routing:/data
    healthcheck:
      test: ["CMD", "essence-routing", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped

  # Address search for Best on the way (Photon), in the "trip" profile too. It builds its index of Québec's places on its
  # first start (a 1.6 GB download, then about 10 minutes and 3 GB of RAM) into the geocoding volume, refreshes it every
  # REFRESH_DAYS days, and reports its progress at :9090/status; the search says it's coming meanwhile, and pins work.
  # GEOCODING_DUMP_URL in .env points it at another copy of Photon's dump.
  geocoding:
    profiles: [trip]
    build:
      context: .
      dockerfile: src/Essence.Geocoding/Dockerfile
    environment:
      REFRESH_DAYS: ${REFRESH_DAYS:-30}
      GEOCODING_DUMP_URL: ${GEOCODING_DUMP_URL:-}
    volumes:
      - geocoding:/data
    healthcheck:
      test: ["CMD", "essence-geocoding", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped

  # Static Blazor WebAssembly app. Its nginx also forwards /api/ to the api service, which the app calls (same origin, no CORS).
  web:
    build:
      context: .
      dockerfile: src/Essence.Web/Dockerfile
    ports:
      - "${WEB_PORT:-8081}:8080"
    healthcheck:
      # The api's /alive through this container's /api/ proxy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  pgdata:
  data:
  routing:
  geocoding:
