# Essence on TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML, app name "essence".
#
# Before pasting, replace:
#   - every CHANGE_ME_..._PASSWORD (each appears twice). Use letters and digits only: they go into connection strings.
#   - POOL in the host paths, and create them first:
#     - postgres: its own dataset with the Generic preset (POSIX permissions), owned by 999:999, mode 700. Postgres won't
#       start in a folder that inherits NFSv4 ACLs (the Apps preset).
#     - data: owned by 1654:1654 (ingest), which creates the archive subfolder in it. NFSv4 ACLs are fine here.
#   - 30180, if that port is taken. Point the reverse proxy for <your domain> at http://<NAS address>:30180:
#     it serves the map and, under /api/, the API.
#
# The images come from the GitHub Container Registry, published by .github/workflows/publish.yml on every push to main.
# TrueNAS offers Update once a day when one changed. To roll out each push within about 10 minutes instead, run
# deploy/truenas-autodeploy.py from a cron job (README → Deploy).
#
# Routing and the address search keep their data in the named volumes at the end, which Docker creates (in the apps
# pool's ix-apps dataset) and which they fill themselves: rebuildable caches, deleted with the app.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: essence
      POSTGRES_USER: essence_admin
      POSTGRES_PASSWORD: CHANGE_ME_ADMIN_PASSWORD
    volumes:
      # PostgreSQL 18 images keep data in a versioned subfolder of /var/lib/postgresql.
      - type: bind
        source: /mnt/POOL/apps/essence/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      # Over TCP: on first start, the server that initializes the database answers on the socket only, and migrate would fail.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "essence_admin", "-d", "essence"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations, then creates the essence_writer and essence_reader roles (or updates their passwords).
  migrate:
    image: ghcr.io/etiennex9/essence-migrator:latest
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: UTC
      ConnectionStrings__Admin: Host=postgres;Database=essence;Username=essence_admin;Password=CHANGE_ME_ADMIN_PASSWORD;GSS Encryption Mode=Disable
      Roles__WriterPassword: CHANGE_ME_WRITER_PASSWORD
      Roles__ReaderPassword: CHANGE_ME_READER_PASSWORD
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    image: ghcr.io/etiennex9/essence-ingest:latest
    environment:
      DOTNET_ENVIRONMENT: Production
      TZ: UTC
      ConnectionStrings__Essence: Host=postgres;Database=essence;Username=essence_writer;Password=CHANGE_ME_WRITER_PASSWORD;GSS Encryption Mode=Disable
      Archive__Path: /data/archive
    volumes:
      - type: bind
        source: /mnt/POOL/apps/essence/data
        target: /data
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # No published port: only the web container reaches it, under /api/.
  api:
    image: ghcr.io/etiennex9/essence-api:latest
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      TZ: UTC
      ConnectionStrings__Essence: Host=postgres;Database=essence;Username=essence_reader;Password=CHANGE_ME_READER_PASSWORD;GSS Encryption Mode=Disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Road distances for Best near you, and Best on the way. No published port: only the api calls it, on 5000, and reads
  # its progress on 9090. The api runs without it: it estimates distances, and trips say they'll be ready soon. It builds
  # Québec's road data on its first start (a 1.2 GB download from Geofabrik, then a few minutes), refreshes it every
  # REFRESH_DAYS days when the extract changed (0: never), and keeps serving the current data meanwhile.
  routing:
    image: ghcr.io/etiennex9/essence-routing:latest
    environment:
      REFRESH_DAYS: "30"
    volumes:
      - routing:/data
    # Building while serving: 3.2 GB for osrm-extract, 0.7 GB for the server, and room for the files' cache.
    mem_limit: 5g
    # Healthy while its supervisor runs, whether it builds, serves or waits to try again: a first build doesn't hold the
    # app in Deploying.
    healthcheck:
      test: ["CMD", "essence-routing", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped

  # Address search for Best on the way: Photon, with Québec's places from OpenStreetMap. No published port: the api calls
  # it on 2322 and reads its progress on 9090, and runs without it (the search says it'll be ready soon; pins still
  # work). It builds its index on its first start (a 1.6 GB download, then about 10 minutes), refreshes it every
  # REFRESH_DAYS days when the dump changed, and keeps serving meanwhile. Photon logs no requests.
  geocoding:
    image: ghcr.io/etiennex9/essence-geocoding:latest
    environment:
      REFRESH_DAYS: "30"
    volumes:
      - geocoding:/data
    # Building while serving: about 2.7 GB for the import and the server's 1 GB heap, and room for the files' cache.
    mem_limit: 5g
    healthcheck:
      test: ["CMD", "essence-geocoding", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped

  web:
    image: ghcr.io/etiennex9/essence-web:latest
    ports:
      - "30180:8080"
    healthcheck:
      # The api's /alive through this container's /api/ proxy, so the app shows as running once both answer.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

# The routing data and the address index: built by their containers, rebuilt when lost.
volumes:
  routing:
  geocoding:
