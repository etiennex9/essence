# The scheme the browser used: a reverse proxy in front terminates HTTPS and says so; without one, this server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Requests whose query string says where the user is or is going aren't logged (location ^~ /api/): Best near you's,
# trips' and places', and the nearby stations', since after a locate the map's centre is the user's position.
map $request_uri $essence_log {
    ~^/api/(stations/(best|nearby)|trips/|places/)  0;
    default                                         1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects are relative, so they keep the public scheme, host and port when a reverse proxy is in front.
    absolute_redirect off;

    # Behind a reverse proxy on the local network, $remote_addr becomes the client's address from X-Forwarded-For
    # (the rightmost one that isn't a private address, so a client can't choose its own).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # dotnet publish writes a .gz next to every file.
    gzip_static on;

    # The API under the app's own origin: one public address and no CORS. Looked up per request through Docker's DNS,
    # so nginx starts before the api service exists and follows it when it restarts.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /api;
        # Here rather than in a nested location, which would lose the proxy_pass and the rewrite.
        access_log /var/log/nginx/access.log main if=$essence_log;
    }

    location = /api {
        return 301 /api/;
    }

    # Everything under _framework is fingerprinted, so it can be cached for good.
    location ^~ /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Written at container start from ESSENCE_API_BASE_URL (40-essence-config.sh). Never cached: it changes with the deployment.
    location = /appsettings.json {
        alias /tmp/essence/appsettings.json;
        gzip_static off;
        add_header Cache-Control "no-store";
    }

    # The release notes (see the Dockerfile). Revalidated, as they change with each release; a missing file is a 404 rather
    # than the page (location / below), which the app reads as a development version.
    location ^~ /release/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # MapLibre ships as ES modules; older mime.types files don't know the .mjs extension.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    # The page and the files under _content aren't fingerprinted: revalidate them (cheap 304s) so a deployment shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
