server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # dotnet publish writes a .gz next to every file.
    gzip_static on;

    # Everything under _framework is fingerprinted, so it can be cached for good.
    location ^~ /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Written at container start from ESSENCE_API_BASE_URL (40-essence-config.sh). Never cached: it changes with the deployment.
    location = /appsettings.json {
        alias /tmp/essence/appsettings.json;
        gzip_static off;
        add_header Cache-Control "no-store";
    }

    # MapLibre ships as ES modules; older mime.types files don't know the .mjs extension.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    # The page and the files under _content aren't fingerprinted: revalidate them (cheap 304s) so a deployment shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
