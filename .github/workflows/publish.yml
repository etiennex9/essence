# Tests, then builds the images whose inputs changed (see .github/scripts/select-images.sh). Outside pull requests, pushes
# them to ghcr.io/<owner>/essence-<app>, tagged sha-<commit>; on main, then moves latest to all of them together. On main,
# it first dates the push with the day tags (vYYYY-MM-DD), and the web image carries the version and changelog they give
# (README → Versions).
name: Publish

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

# A pull request's newer push cancels its older run. On main, a run waits for the one in progress instead, so that the
# promote job is never stopped halfway. Only one run waits: a newer one replaces it, and a push run's changes include
# those of a push run it replaces. A manual run that a push replaces is canceled, though: start it again afterwards.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compared with the pull request's base, or on main with the last successful push run, so that the changes of a
      # canceled or failed run are built by the next one. Pull request runs don't count: one from a fork's main is listed
      # under main too, and once it's merged with a merge commit, diffing from its head would leave out the pull request's
      # own changes. A manual run builds every image.
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push) last=$(gh run list --workflow publish.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
                  range="${last:+$last..HEAD}" ;;
            *) range="" ;;
          esac
          images=$(bash .github/scripts/select-images.sh "$range")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Points each day tag, vYYYY-MM-DD, at what main was at the end of that day in Québec, from GitHub's activity log: the
  # time main moved, whatever the commits' own dates or when this run started. Every run re-derives the log's last 100
  # moves, so one that was replaced while it waited is made up for by the next. The tags are this job's: don't create or
  # move them by hand, and a tag ruleset on v* would have to let GitHub Actions bypass it. Same condition as promote's.
  tag:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project tools/Essence.Release --configuration Release -- tag

  # Runs on pull requests too, where tag is skipped, but not when a job it needs failed or was canceled.
  image:
    needs: [test, changes, tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      # The web image's release notes come from the whole history and its day tags: fetch-depth 0 (all) for it, 1 for the
      # others. In that order, because 0 is false in an expression: web && 0 || 1 would always give 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.app != 'web' && 1 || 0 }}
      # release.json and changelog-<month>.json, given to the build as its "release" context (src/Essence.Web/Dockerfile).
      # On main, it fails when no day tag contains the commit rather than ship an app without a version.
      - if: matrix.app == 'web'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - if: matrix.app == 'web'
        run: dotnet run --project tools/Essence.Release --configuration Release -- notes "$RUNNER_TEMP/release"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/essence-${{ matrix.app }}
          # latest moves in the promote job, once every image of the run is pushed.
          tags: type=sha,format=short
      # The Dockerfiles expect the repository root as their build context.
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ${{ matrix.app == 'web' && format('release={0}/release', runner.temp) || '' }}
          file: src/${{ matrix.project }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Moves latest to the run's images together, after every one of them is pushed, so that a host that polls latest
  # (deploy/truenas-autodeploy.py) doesn't start a new migrator next to an old api. If an image fails to build, none
  # moves. If this job fails partway, latest is a mix until it succeeds: use Re-run failed jobs, but only on the latest
  # run on main. A later run rebuilds this run's images and moves latest past them; re-running this one afterwards would
  # move latest back to its sha tags.
  promote:
    needs: [changes, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sha-<commit> is the tag docker/metadata-action gave the images: the commit's first 7 characters. Every source is
      # checked before any tag moves, and each move is retried, so that a registry hiccup doesn't leave latest on a mix.
      # deploy/truenas-autodeploy.py waits for two checks 2 minutes apart to agree, longer than these retries.
      - env:
          IMAGES: ${{ needs.changes.outputs.images }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/essence
        run: |
          apps=$(jq -r '.[].app' <<<"$IMAGES")
          for app in $apps; do
            docker buildx imagetools inspect "${REPOSITORY,,}-$app:sha-${GITHUB_SHA::7}" >/dev/null
          done
          for app in $apps; do
            image="${REPOSITORY,,}-$app"
            for attempt in 1 2 3 4 5; do
              docker buildx imagetools create --tag "$image:latest" "$image:sha-${GITHUB_SHA::7}" && break
              [ "$attempt" = 5 ] && exit 1
              sleep 15
            done
          done
